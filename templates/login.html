<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AINewsPost - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        document.documentElement.classList.add('dark');
    </script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 rounded-lg shadow-xl p-8 w-full max-w-md border border-gray-700">
        <h1 class="text-4xl font-bold text-center text-white mb-2">📰</h1>
        <h2 class="text-3xl font-bold text-center text-white mb-1">AINewsPost</h2>
        <p class="text-center text-gray-400 mb-8">Your personal AI news digest</p>

        {% if error %}
        <div class="bg-red-900 border border-red-700 text-red-100 px-4 py-3 rounded mb-6">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-4" id="loginForm">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="your@email.com"
                    required
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none pr-10"
                    >
                    <button
                        type="button"
                        id="togglePwd"
                        class="absolute right-3 top-2.5 text-gray-400 hover:text-white"
                    >
                        👁️
                    </button>
                </div>
            </div>

            <button
                type="submit"
                id="submitBtn"
                class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700 transition duration-200"
            >
                Login
            </button>

            <div id="spinner" class="hidden text-center py-4">
                <div class="inline-block">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                </div>
            </div>
        </form>
    </div>

    <script>
        const pwdField = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePwd');
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');

        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const type = pwdField.type === 'password' ? 'text' : 'password';
            pwdField.type = type;
            toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
        });

        form.addEventListener('submit', (e) => {
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.5';
            spinner.classList.remove('hidden');
        });

        pwdField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                form.submit();
            }
        });
    </script>
</body>
</html>
