{% extends "base.html" %}

{% block title %}Chatbot{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
.markdown-content {
  font-size: 0.95rem;
  line-height: 1.6;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.markdown-content h1, .markdown-content h2, .markdown-content h3 {
  margin: 0.75rem 0 0.5rem 0;
  font-weight: 600;
  color: #e0e0e0;
}
.markdown-content h1 { font-size: 1.5rem; }
.markdown-content h2 { font-size: 1.3rem; }
.markdown-content h3 { font-size: 1.1rem; }
.markdown-content p {
  margin: 0.5rem 0;
  color: #d0d0d0;
}
.markdown-content strong, .markdown-content b {
  font-weight: 700;
  color: #e0e0e0;
}
.markdown-content em, .markdown-content i {
  font-style: italic;
  color: #d0d0d0;
}
.markdown-content code {
  background: #1a1a1a;
  padding: 0.2rem 0.4rem;
  border-radius: 3px;
  font-family: monospace;
  font-size: 0.9rem;
  color: #60a5fa;
}
.markdown-content pre {
  background: #1a1a1a;
  padding: 0.75rem;
  border-radius: 4px;
  overflow-x: auto;
  margin: 0.5rem 0;
  border: 1px solid #333;
}
.markdown-content pre code {
  background: none;
  padding: 0;
  color: #d0d0d0;
}
.markdown-content ul, .markdown-content ol {
  margin: 0.75rem 0;
  padding-left: 2rem;
}
.markdown-content li {
  margin: 0.35rem 0;
  color: #d0d0d0;
}
.markdown-content blockquote {
  border-left: 3px solid #3b82f6;
  padding-left: 0.75rem;
  margin: 0.75rem 0;
  color: #a0a0a0;
  font-style: italic;
}
.markdown-content a {
  color: #60a5fa;
  text-decoration: underline;
}
.markdown-content a:hover {
  color: #93c5fd;
}
.markdown-content table {
  border-collapse: collapse;
  margin: 0.75rem 0;
}
.markdown-content td, .markdown-content th {
  border: 1px solid #444;
  padding: 0.5rem;
}
.markdown-content th {
  background: #1a1a1a;
  font-weight: 600;
}

.message-info-accordion {
  margin-top: 0.5rem;
  font-size: 0.85rem;
}

.info-toggle {
  background: none;
  border: none;
  color: #888;
  cursor: pointer;
  padding: 0.25rem 0.5rem;
  text-align: left;
  font-size: 0.85rem;
}

.info-toggle:hover {
  color: #aaa;
}

.info-content {
  margin-top: 0.35rem;
  padding: 0.5rem;
  background: #1a1a1a;
  border-radius: 3px;
  color: #999;
}

.info-content div {
  margin: 0.35rem 0;
}

.info-content pre {
  background: #0a0a0a;
  padding: 0.35rem;
  border-radius: 2px;
  font-size: 0.8rem;
  overflow-x: auto;
  margin: 0.25rem 0;
}
</style>

<div class="chatbot-container" style="flex: 1; display: flex; flex-direction: row; margin: 0; padding: 0; min-height: 0; overflow: hidden;">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Chats</h2>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <a href="/chatbot" class="btn btn-primary btn-sm">+ New</a>
        <button id="chatbot-sidebar-toggle" class="btn btn-sm" style="background: #444; padding: 0.4rem 0.6rem; line-height: 1;" onclick="toggleChatbotSidebar()">
          <svg style="width: 16px; height: 16px; display: inline;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
      </div>
    </div>
    <div id="sessions-list" class="sessions-list">
      <!-- Sessions will be loaded here -->
    </div>
  </div>

  <div class="chat-main">
    {% if current_session %}
    <div class="chat-header">
      <h2 id="session-title">{{ current_session.title }}</h2>
      <div class="chat-actions">
        <button id="delete-session-btn" class="btn btn-danger btn-sm">Delete</button>
      </div>
    </div>

    <div id="chat-messages" class="chat-messages">
      <!-- Messages will be loaded here -->
    </div>

    <div class="chat-input-area">
      <form id="chat-form" onsubmit="sendMessage(event)">
        <textarea id="message-input" placeholder="Ask me about AI, LLMs, agents..." rows="1" disabled></textarea>
        <button type="submit" class="btn btn-primary" id="send-btn" disabled>Send</button>
      </form>
    </div>
    {% else %}
    <div class="empty-state">
      <h2>Start a new chat</h2>
      <p>Begin typing your question about AI topics</p>
    </div>

    <div class="chat-input-area">
      <form id="new-chat-form" onsubmit="createSessionAndSend(event)">
        <textarea id="first-message-input" placeholder="Ask me about AI, LLMs, agents..." rows="1"></textarea>
        <button type="submit" class="btn btn-primary">Start Chat</button>
      </form>
    </div>
    {% endif %}
  </div>
</div>

<script>
let currentSessionId = {{ current_session.id if current_session else 'null' }};
let isSending = false;
let messagesLoaded = false;

window.addEventListener('beforeunload', (e) => {
  if (isSending) {
    e.preventDefault();
    e.returnValue = 'Message is being sent. Please wait...';
    return 'Message is being sent. Please wait...';
  }
});

async function loadSessions() {
  const list = document.getElementById('sessions-list');
  list.innerHTML = '<div style="padding: 1rem; color: #888;">Loading...</div>';
  
  try {
    const res = await fetch('/api/chatbot/sessions');
    const data = await res.json();
    list.innerHTML = '';
    
    if (data.error) {
      list.innerHTML = `<div style="padding: 1rem; color: #f87171;">Error: ${escapeHtml(data.error)}</div>`;
      return;
    }
    
    data.sessions.forEach(s => {
      const el = document.createElement('div');
      el.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      el.innerHTML = `
        <div class="session-title">${escapeHtml(s.title)}</div>
        <div class="session-date">${new Date(s.updated_at).toLocaleDateString()}</div>
      `;
      el.onclick = () => loadSession(s.id);
      list.appendChild(el);
    });
  } catch (err) {
    console.error(err);
    list.innerHTML = '<div style="padding: 1rem; color: #f87171;">Failed to load sessions</div>';
  }
}

async function loadSession(sessionId) {
  currentSessionId = sessionId;
  messagesLoaded = false;
  
  // Add spinner to session item
  const clickedEl = event.target.closest('.session-item');
  const spinner = document.createElement('span');
  spinner.className = 'spinner';
  spinner.style.marginLeft = '0.5rem';
  clickedEl.appendChild(spinner);
  
  // Update URL without reload
  window.history.pushState({}, '', `/chatbot?session=${sessionId}`);
  
  // Update active session in sidebar
  document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
  clickedEl.classList.add('active');
  
  // Reset message input
  const messageInput = document.getElementById('message-input');
  if (messageInput) {
    messageInput.disabled = true;
    messageInput.value = '';
  }
  const sendBtn = document.getElementById('send-btn');
  if (sendBtn) sendBtn.disabled = true;
  
  // Show loading in chat area
  let messagesDiv = document.getElementById('chat-messages');
  if (!messagesDiv) {
    messagesDiv = document.createElement('div');
    messagesDiv.id = 'chat-messages';
    messagesDiv.className = 'chat-messages';
    const chatMain = document.querySelector('.chat-main');
    chatMain.appendChild(messagesDiv);
  }
  
  messagesDiv.innerHTML = `
    <div class="loading-overlay">
      <div class="spinner"></div>
      <div>Loading chat...</div>
    </div>
  `;
  
  try {
    // Load messages
    await loadMessages();
  } finally {
    // Remove spinner
    spinner.remove();
  }
}

async function loadMessages() {
  if (!currentSessionId) return;
  
  let messagesDiv = document.getElementById('chat-messages');
  if (!messagesDiv) return;
  
  messagesDiv.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #888;">Loading messages...</div>';
  
  try {
    const res = await fetch(`/api/chatbot/sessions/${currentSessionId}/messages`);
    const data = await res.json();
    messagesDiv.innerHTML = '';
    
    if (data.error) {
      messagesDiv.innerHTML = `<div style="color: #f87171; padding: 1rem;">Error: ${escapeHtml(data.error)}</div>`;
      return;
    }
    
    data.messages.forEach(msg => {
      const msgEl = document.createElement('div');
      msgEl.className = `message ${msg.role}`;
      
      if (msg.role === 'assistant') {
        // Render markdown for bot messages
        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content markdown-content';
        try {
          if (window.marked) {
            contentDiv.innerHTML = marked.parse(msg.content);
          } else {
            contentDiv.textContent = msg.content;
          }
        } catch (e) {
          contentDiv.textContent = msg.content;
        }
        msgEl.appendChild(contentDiv);
        
        // Show guardrail info if present
        if (msg.guardrail_info || msg.search_results) {
          const infoDiv = document.createElement('div');
          infoDiv.className = 'message-info-accordion';
          infoDiv.innerHTML = `
            <button class="info-toggle" onclick="toggleMessageInfo(this)">▶ Details</button>
            <div class="info-content" style="display: none;">
              ${msg.guardrail_info ? `<div><strong>Guardrails:</strong> ${escapeHtml(msg.guardrail_info)}</div>` : ''}
              ${msg.search_results ? `<div><strong>Search Results:</strong><pre>${escapeHtml(msg.search_results)}</pre></div>` : ''}
            </div>
          `;
          msgEl.appendChild(infoDiv);
        }
      } else {
        // Render markdown for user messages too
        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content markdown-content';
        try {
          if (window.marked) {
            contentDiv.innerHTML = marked.parse(msg.content);
          } else {
            contentDiv.textContent = msg.content;
          }
        } catch (e) {
          contentDiv.textContent = msg.content;
        }
        msgEl.appendChild(contentDiv);
      }
      
      messagesDiv.appendChild(msgEl);
    });
    
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  } catch (err) {
    console.error(err);
    messagesDiv.innerHTML = '<div style="color: #f87171; padding: 1rem;">Failed to load messages</div>';
  } finally {
    messagesLoaded = true;
    const messageInput = document.getElementById('message-input');
    if (messageInput) messageInput.disabled = false;
    const sendBtn = document.getElementById('send-btn');
    if (sendBtn) sendBtn.disabled = false;
  }
}

async function sendMessage(e) {
  e.preventDefault();
  if (!messagesLoaded) {
    alert('Please wait for messages to load');
    return;
  }
  if (isSending) {
    return;
  }
  
  // Query input fresh (might have been transformed from createSessionAndSend)
  const messageInput = document.getElementById('message-input');
  if (!messageInput) return;
  
  const message = messageInput.value.trim();
  if (!message || !currentSessionId) return;
  
  isSending = true;
  const btn = e.target.querySelector('button[type="submit"]');
  
  // Show user message immediately
  // Show user message immediately
  const messagesDiv = document.getElementById('chat-messages');
  const userMsgEl = document.createElement('div');
  userMsgEl.className = 'message user';
  const userContentDiv = document.createElement('div');
  userContentDiv.className = 'message-content markdown-content';
  if (window.marked) {
    userContentDiv.innerHTML = marked.parse(message);
  } else {
    userContentDiv.textContent = message;
  }
  userMsgEl.appendChild(userContentDiv);
  messagesDiv.appendChild(userMsgEl);
  
  // Clear input immediately
  messageInput.value = '';
  
  // Disable button + show loading
  btn.disabled = true;
  btn.textContent = 'Sending...';
  messageInput.disabled = true;
  
  // Add loading indicator
  const loadingMsgEl = document.createElement('div');
  loadingMsgEl.className = 'message assistant';
  loadingMsgEl.innerHTML = `<div class="message-content" style="color: #888;">⏳ Thinking...</div>`;
  messagesDiv.appendChild(loadingMsgEl);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  
  try {
    const res = await fetch(`/api/chatbot/sessions/${currentSessionId}/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    
    const data = await res.json();
    
    // Remove loading indicator
    loadingMsgEl.remove();
    
    if (data.error) {
      const errMsgEl = document.createElement('div');
      errMsgEl.className = 'message assistant';
      errMsgEl.innerHTML = `<div class="message-content" style="color: #f87171;">Error: ${escapeHtml(data.error)}</div>`;
      messagesDiv.appendChild(errMsgEl);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return;
    }
    
    // Add bot message to UI with markdown
    const botMsgEl = document.createElement('div');
    botMsgEl.className = 'message assistant';
    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content markdown-content';
    
    try {
      if (window.marked) {
        contentDiv.innerHTML = marked.parse(data.response);
      } else {
        contentDiv.textContent = data.response;
      }
    } catch (e) {
      console.error('Markdown render error:', e);
      contentDiv.textContent = data.response;
    }
    
    botMsgEl.appendChild(contentDiv);
    
    // Add message info accordion if search or guardrails present
    if (data.search_query || data.search_results || data.guardrail_verdict !== 'ok') {
      const infoDiv = document.createElement('div');
      infoDiv.className = 'message-info-accordion';
      let infoHTML = '<button class="info-toggle" onclick="toggleMessageInfo(this)">▶ Details</button><div class="info-content" style="display: none;">';
      
      if (data.guardrail_verdict !== 'ok') {
        infoHTML += `<div><strong>Guardrails:</strong> ${escapeHtml(data.guardrail_verdict)}: ${escapeHtml(data.guardrail_reason || '')}</div>`;
      }
      
      if (data.search_query) {
        infoHTML += `<div style="margin-top: 0.5rem;"><strong>Search Query:</strong> ${escapeHtml(data.search_query)}</div>`;
      }
      
      if (data.search_results) {
        infoHTML += `<div style="margin-top: 0.5rem;"><strong>Search Results:</strong><pre style="font-size: 0.8rem; margin-top: 0.25rem;">${escapeHtml(data.search_results)}</pre></div>`;
      }
      
      infoHTML += '</div>';
      infoDiv.innerHTML = infoHTML;
      botMsgEl.appendChild(infoDiv);
    }
    
    messagesDiv.appendChild(botMsgEl);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    
  } catch (err) {
    console.error(err);
    loadingMsgEl.innerHTML = `<div class="message-content" style="color: #f87171;">Failed to send message</div>`;
  } finally {
    isSending = false;
    btn.disabled = false;
    btn.textContent = 'Send';
    messageInput.disabled = false;
    messageInput.focus();
  }
}

async function createSessionAndSend(e) {
  e.preventDefault();
  const input = document.getElementById('first-message-input');
  const message = input.value.trim();
  if (!message) return;
  
  const btn = e.target.querySelector('button[type="submit"]');
  
  // Clear input immediately
  input.value = '';
  
  // Show user message immediately
  const messagesDiv = document.createElement('div');
  messagesDiv.id = 'chat-messages';
  messagesDiv.className = 'chat-messages';
  
  const userMsgEl = document.createElement('div');
  userMsgEl.className = 'message user';
  const userContentDiv = document.createElement('div');
  userContentDiv.className = 'message-content markdown-content';
  if (window.marked) {
    userContentDiv.innerHTML = marked.parse(message);
  } else {
    userContentDiv.textContent = message;
  }
  userMsgEl.appendChild(userContentDiv);
  messagesDiv.appendChild(userMsgEl);
  
  // Show loading
  const loadingMsgEl = document.createElement('div');
  loadingMsgEl.className = 'message assistant';
  loadingMsgEl.innerHTML = `<div class="message-content" style="color: #888;">⏳ Creating chat...</div>`;
  messagesDiv.appendChild(loadingMsgEl);
  
  // Replace empty state + rebuild chat UI properly
  const chatMain = document.querySelector('.chat-main');
  const emptyState = document.querySelector('.empty-state');
  const inputArea = document.querySelector('.chat-input-area');
  
  if (emptyState) emptyState.remove();
  
  // Add header
  const header = document.createElement('div');
  header.className = 'chat-header';
  header.innerHTML = `
    <h2 id="session-title">New Chat</h2>
    <div class="chat-actions">
      <button id="delete-session-btn" class="btn btn-danger btn-sm">Delete</button>
    </div>
  `;
  
  // Insert in correct order
  chatMain.insertBefore(header, inputArea);
  chatMain.insertBefore(messagesDiv, inputArea);
  
  // Wire up delete button
  document.getElementById('delete-session-btn').addEventListener('click', deleteSession);
  
  btn.disabled = true;
  btn.textContent = 'Creating chat...';
  
  try {
    // Create session
    const now = new Date();
    const title = now.toLocaleString();
    const sessionRes = await fetch('/api/chatbot/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });
    
    const sessionData = await sessionRes.json();
    if (sessionData.error || !sessionData.session_id) {
      loadingMsgEl.innerHTML = `<div class="message-content" style="color: #f87171;">Error creating chat</div>`;
      btn.disabled = false;
      btn.textContent = 'Start Chat';
      return;
    }
    
    currentSessionId = sessionData.session_id;
    messagesLoaded = true;
    
    // Update title
    const titleEl = document.getElementById('session-title');
    if (titleEl) titleEl.textContent = title;
    
    // Update URL
    window.history.pushState({}, '', `/chatbot?session=${currentSessionId}`);
    
    // Transform form ID and input for existing session
    const form = document.getElementById('new-chat-form');
    form.id = 'chat-form';
    form.onsubmit = sendMessage;
    input.id = 'message-input';
    input.placeholder = 'Ask me about AI, LLMs, agents...';
    
    // Update sidebar with new session
    const sessionsList = document.getElementById('sessions-list');
    const newSessionEl = document.createElement('div');
    newSessionEl.className = 'session-item active';
    newSessionEl.innerHTML = `
      <div class="session-title">${escapeHtml(title)}</div>
      <div class="session-date">${new Date().toLocaleDateString()}</div>
    `;
    newSessionEl.onclick = () => loadSession(sessionData.session_id);
    
    // Remove active class from others
    document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
    
    // Prepend to top of list
    sessionsList.insertBefore(newSessionEl, sessionsList.firstChild);
    
    loadingMsgEl.innerHTML = `<div class="message-content" style="color: #888;">⏳ Sending...</div>`;
    
    // Send message
    const msgRes = await fetch(`/api/chatbot/sessions/${currentSessionId}/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    
    const msgData = await msgRes.json();
    loadingMsgEl.remove();
    
    if (msgData.error) {
      const errEl = document.createElement('div');
      errEl.className = 'message assistant';
      errEl.innerHTML = `<div class="message-content" style="color: #f87171;">Error: ${escapeHtml(msgData.error)}</div>`;
      messagesDiv.appendChild(errEl);
      return;
    }
    
    // Show bot response
    const botMsgEl = document.createElement('div');
    botMsgEl.className = 'message assistant';
    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content markdown-content';
    if (window.marked) {
      contentDiv.innerHTML = marked.parse(msgData.response);
    } else {
      contentDiv.textContent = msgData.response;
    }
    botMsgEl.appendChild(contentDiv);
    
    // Show message info accordion
    if (msgData.search_query || msgData.search_results || msgData.guardrail_info) {
      const infoDiv = document.createElement('div');
      infoDiv.className = 'message-info-accordion';
      let infoHTML = '<button class="info-toggle" onclick="toggleMessageInfo(this)">▶ Details</button><div class="info-content" style="display: none;">';
      
      if (msgData.guardrail_info) {
        infoHTML += `<div><strong>Guardrails:</strong> ${escapeHtml(msgData.guardrail_info)}</div>`;
      }
      
      if (msgData.search_query) {
        infoHTML += `<div style="margin-top: 0.5rem;"><strong>Search Query:</strong> ${escapeHtml(msgData.search_query)}</div>`;
      }
      
      if (msgData.search_results) {
        infoHTML += `<div style="margin-top: 0.5rem;"><strong>Search Results:</strong><pre style="font-size: 0.8rem; margin-top: 0.25rem;">${escapeHtml(msgData.search_results)}</pre></div>`;
      }
      
      infoHTML += '</div>';
      infoDiv.innerHTML = infoHTML;
      botMsgEl.appendChild(infoDiv);
    }
    
    messagesDiv.appendChild(botMsgEl);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    
    // Enable input
    input.disabled = false;
    input.focus();
    
    btn.disabled = false;
    btn.textContent = 'Send';
    
  } catch (err) {
    console.error(err);
    loadingMsgEl.innerHTML = `<div class="message-content" style="color: #f87171;">Error creating chat</div>`;
    btn.disabled = false;
    btn.textContent = 'Start Chat';
  }
}

// Check if we just created a session and need to prefill message
function autofillFirstMessage() {
  const msg = localStorage.getItem('chatbot_first_message');
  if (msg && currentSessionId) {
    localStorage.removeItem('chatbot_first_message');
    const input = document.getElementById('message-input');
    if (input) {
      input.value = msg;
      input.focus();
    }
  }
}

async function deleteSession() {
  if (!currentSessionId) return;
  if (!confirm('Delete this chat? This cannot be undone.')) return;
  
  const res = await fetch(`/api/chatbot/sessions/${currentSessionId}`, {
    method: 'DELETE'
  });
  
  if (res.ok) {
    window.location.href = '/chatbot';
  } else {
    alert('Error deleting session');
  }
}

function escapeHtml(text) {
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, m => map[m]);
}

function toggleMessageInfo(btn) {
  const content = btn.nextElementSibling;
  const icon = btn.querySelector('span') || btn.textContent[0];
  const isOpen = content.style.display !== 'none';
  content.style.display = isOpen ? 'none' : 'block';
  btn.textContent = (isOpen ? '▶' : '▼') + btn.textContent.slice(1);
}

function toggleChatbotSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const isCollapsed = sidebar.classList.contains('collapsed');
  if (isCollapsed) {
    sidebar.classList.remove('collapsed');
  } else {
    sidebar.classList.add('collapsed');
  }
  localStorage.setItem('chatbot-sidebar-collapsed', !isCollapsed);
}

// Restore sidebar state on load
document.addEventListener('DOMContentLoaded', function() {
  if (localStorage.getItem('chatbot-sidebar-collapsed') === 'true') {
    document.querySelector('.sidebar')?.classList.add('collapsed');
  }
});

function toggleChatbotSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const isCollapsed = sidebar.classList.contains('collapsed');
  if (isCollapsed) {
    sidebar.classList.remove('collapsed');
  } else {
    sidebar.classList.add('collapsed');
  }
  localStorage.setItem('chatbot-sidebar-collapsed', !isCollapsed);
}

// Restore sidebar state
if (localStorage.getItem('chatbot-sidebar-collapsed') === 'true') {
  document.querySelector('.sidebar')?.classList.add('collapsed');
}

document.getElementById('delete-session-btn')?.addEventListener('click', deleteSession);

// Initial load
loadSessions();
if (currentSessionId) {
  const messageInput = document.getElementById('message-input');
  if (messageInput) messageInput.disabled = true;
  loadMessages();
  autofillFirstMessage();
}
</script>
{% endblock %}
