{% extends "base.html" %}

{% block title %}Chatbot{% endblock %}

{% block content %}
<div class="chatbot-container" style="flex: 1; display: flex; flex-direction: row; margin: 0; padding: 0; min-height: 0;">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Chats</h2>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <a href="/chatbot" class="btn btn-primary btn-sm">+ New</a>
        <button id="chatbot-sidebar-toggle" class="btn btn-sm" style="background: #444; padding: 0.4rem 0.6rem; line-height: 1;" onclick="toggleChatbotSidebar()">
          <svg style="width: 16px; height: 16px; display: inline;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
      </div>
    </div>
    <div id="sessions-list" class="sessions-list">
      <!-- Sessions will be loaded here -->
    </div>
  </div>

  <div class="chat-main">
    {% if current_session %}
    <div class="chat-header">
      <h2 id="session-title">{{ current_session.title }}</h2>
      <div class="chat-actions">
        <button id="delete-session-btn" class="btn btn-danger btn-sm">Delete</button>
      </div>
    </div>

    <div id="chat-messages" class="chat-messages">
      <!-- Messages will be loaded here -->
    </div>

    <div id="guardrails-section" class="guardrails-section hidden">
      <div class="guardrails-header">
        <strong>Processing:</strong>
        <span id="guardrail-verdict" class="verdict"></span>
      </div>
      <div id="guardrails-details">
        <p id="guardrail-reason"></p>
        <div id="search-section" class="search-section hidden">
          <strong>Web Search:</strong>
          <p id="search-query"></p>
          <div id="search-results"></div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <form id="chat-form" onsubmit="sendMessage(event)">
        <textarea id="message-input" placeholder="Ask me about AI, LLMs, agents..." rows="1"></textarea>
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>
    {% else %}
    <div class="empty-state">
      <h2>Start a new chat</h2>
      <p>Begin typing your question about AI topics</p>
    </div>

    <div class="chat-input-area">
      <form id="new-chat-form" onsubmit="createSessionAndSend(event)">
        <textarea id="first-message-input" placeholder="Ask me about AI, LLMs, agents..." rows="1"></textarea>
        <button type="submit" class="btn btn-primary">Start Chat</button>
      </form>
    </div>
    {% endif %}
  </div>
</div>

<style>
.chatbot-container {
  display: flex;
  flex: 1;
  gap: 0;
  background: #1a1a1a;
  width: 100%;
  min-height: 0;
}

.sidebar {
  width: 300px;
  height: 100%;
  background: #2a2a2a;
  border-right: 1px solid #444;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.3s ease;
  position: relative;
}

.sidebar.collapsed {
  width: 60px;
  border-right: 1px solid #444;
}

.sidebar-header {
  padding: 1rem;
  border-bottom: 1px solid #444;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.sidebar.collapsed .sidebar-header {
  padding: 0.5rem;
  justify-content: center;
}

.sidebar.collapsed .sidebar-header h2,
.sidebar.collapsed .sidebar-header a {
  display: none;
}

.sidebar.collapsed .sidebar-header button {
  margin: 0;
}

#chatbot-sidebar-toggle {
  transition: transform 0.3s ease;
}

.sidebar.collapsed #chatbot-sidebar-toggle {
  transform: rotate(180deg);
}

.sidebar-header h2 {
  margin: 0;
  font-size: 1.2rem;
  color: #e0e0e0;
  flex: 1;
}

.sessions-list {
  flex: 1;
  overflow-y: auto;
}

.sidebar.collapsed .sessions-list {
  display: none;
}

.session-item {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid #3a3a3a;
  cursor: pointer;
  transition: background-color 0.2s;
  color: #b0b0b0;
}

.session-item:hover {
  background-color: #3a3a3a;
}

.session-item.active {
  background-color: #1e3a5f;
  border-left: 3px solid #3b82f6;
  padding-left: calc(1rem - 3px);
  color: #e0e0e0;
}

.session-title {
  font-weight: 500;
  margin: 0 0 0.25rem 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.session-date {
  font-size: 0.85rem;
  color: #666;
}

.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #1f1f1f;
  height: 100%;
}

.chat-header {
  padding: 1rem;
  border-bottom: 1px solid #444;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chat-header h2 {
  margin: 0;
  font-size: 1.3rem;
  color: #e0e0e0;
}

.chat-actions {
  display: flex;
  gap: 0.5rem;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.message {
  display: flex;
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.message.user {
  justify-content: flex-end;
}

.message.assistant {
  justify-content: flex-start;
}

.message-content {
  max-width: 70%;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  line-height: 1.4;
}

.message.user .message-content {
  background-color: #3b82f6;
  color: white;
}

.message.assistant .message-content {
  background-color: #3a3a3a;
  color: #e0e0e0;
}

.guardrails-section {
  margin: 1rem;
  padding: 1rem;
  background-color: #2a2a2a;
  border-left: 3px solid #f59e0b;
  border-radius: 4px;
  font-size: 0.9rem;
  color: #d0d0d0;
}

.guardrails-section.hidden {
  display: none;
}

.guardrails-header {
  margin-bottom: 0.75rem;
}

.verdict {
  font-weight: 600;
  padding: 0.25rem 0.5rem;
  border-radius: 3px;
  margin-left: 0.5rem;
}

.verdict.ok {
  background-color: #10b981;
  color: white;
}

.verdict.off_topic {
  background-color: #f59e0b;
  color: white;
}

.verdict.restricted {
  background-color: #ef4444;
  color: white;
}

.verdict.error {
  background-color: #6b7280;
  color: white;
}

.search-section {
  margin-top: 0.5rem;
  padding: 0.5rem;
  background: #1a1a1a;
  border-radius: 3px;
}

.search-section.hidden {
  display: none;
}

#search-results {
  margin-top: 0.5rem;
  font-size: 0.85rem;
}

.search-result {
  margin: 0.5rem 0;
  padding: 0.5rem;
  background-color: #2a2a2a;
  border-left: 2px solid #3b82f6;
  border-radius: 2px;
  color: #b0b0b0;
}

.search-result-title {
  font-weight: 600;
  color: #60a5fa;
}

.search-result-url {
  font-size: 0.8rem;
  color: #888;
}

.chat-input-area {
  padding: 1rem;
  border-top: 1px solid #444;
  background: #1f1f1f;
  flex-shrink: 0;
}

#chat-form, #new-chat-form {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

#message-input, #first-message-input {
  flex: 1;
  padding: 1rem;
  border: 1px solid #444;
  border-radius: 6px;
  font-family: inherit;
  font-size: 1rem;
  background: #2a2a2a;
  color: #e0e0e0;
  line-height: 1.5;
  min-height: 80px;
  max-height: 200px;
  resize: vertical;
}

#message-input:focus, #first-message-input:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

#message-input::placeholder, #first-message-input::placeholder {
  color: #666;
}

#chat-form button, #new-chat-form button {
  align-self: flex-start;
  background-color: #3b82f6;
  color: white;
  border: none;
  padding: 0.75rem 1.5rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 500;
  transition: background-color 0.2s;
}

#chat-form button:hover, #new-chat-form button:hover {
  background-color: #2563eb;
}

#chat-form button:disabled, #new-chat-form button:disabled {
  background-color: #666;
  cursor: not-allowed;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 1rem;
  color: #666;
}

.btn-sm {
  padding: 0.4rem 0.8rem;
  font-size: 0.85rem;
}

.btn {
  background-color: #3b82f6;
  color: white;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.95rem;
  transition: background-color 0.2s;
}

.btn:hover {
  background-color: #2563eb;
}

.btn-danger {
  background-color: #ef4444;
}

.btn-danger:hover {
  background-color: #dc2626;
}

.loading {
  opacity: 0.6;
  pointer-events: none;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.spinner {
  display: inline-block;
  animation: spin 1s linear infinite;
}
</style>

<script>
let currentSessionId = {{ current_session.id if current_session else 'null' }};
let messageInput = document.getElementById('message-input');

async function loadSessions() {
  const list = document.getElementById('sessions-list');
  list.innerHTML = '<div style="padding: 1rem; color: #888;">Loading...</div>';
  
  try {
    const res = await fetch('/api/chatbot/sessions');
    const data = await res.json();
    list.innerHTML = '';
    
    if (data.error) {
      list.innerHTML = `<div style="padding: 1rem; color: #f87171;">Error: ${escapeHtml(data.error)}</div>`;
      return;
    }
    
    data.sessions.forEach(s => {
      const el = document.createElement('div');
      el.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      el.innerHTML = `
        <div class="session-title">${escapeHtml(s.title)}</div>
        <div class="session-date">${new Date(s.updated_at).toLocaleDateString()}</div>
      `;
      el.onclick = () => loadSession(s.id);
      list.appendChild(el);
    });
  } catch (err) {
    console.error(err);
    list.innerHTML = '<div style="padding: 1rem; color: #f87171;">Failed to load sessions</div>';
  }
}

async function loadSession(sessionId) {
  window.location.href = `/chatbot?session=${sessionId}`;
}

async function loadMessages() {
  if (!currentSessionId) return;
  
  const messagesDiv = document.getElementById('chat-messages');
  messagesDiv.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #888;">Loading messages...</div>';
  
  try {
    const res = await fetch(`/api/chatbot/sessions/${currentSessionId}/messages`);
    const data = await res.json();
    messagesDiv.innerHTML = '';
    
    if (data.error) {
      messagesDiv.innerHTML = `<div style="color: #f87171; padding: 1rem;">Error: ${escapeHtml(data.error)}</div>`;
      return;
    }
    
    data.messages.forEach(msg => {
      const msgEl = document.createElement('div');
      msgEl.className = `message ${msg.role}`;
      msgEl.innerHTML = `<div class="message-content">${escapeHtml(msg.content)}</div>`;
      messagesDiv.appendChild(msgEl);
    });
    
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  } catch (err) {
    console.error(err);
    messagesDiv.innerHTML = '<div style="color: #f87171; padding: 1rem;">Failed to load messages</div>';
  }
}

async function sendMessage(e) {
  e.preventDefault();
  const message = messageInput.value.trim();
  if (!message || !currentSessionId) return;
  
  messageInput.value = '';
  messageInput.disabled = true;
  
  // Add user message to UI
  const messagesDiv = document.getElementById('chat-messages');
  const userMsgEl = document.createElement('div');
  userMsgEl.className = 'message user';
  userMsgEl.innerHTML = `<div class="message-content">${escapeHtml(message)}</div>`;
  messagesDiv.appendChild(userMsgEl);
  
  // Add loading indicator
  const loadingMsgEl = document.createElement('div');
  loadingMsgEl.className = 'message assistant';
  loadingMsgEl.innerHTML = `<div class="message-content" style="color: #888;">⏳ Thinking...</div>`;
  messagesDiv.appendChild(loadingMsgEl);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  
  // Show guardrails section
  const guardrailsSection = document.getElementById('guardrails-section');
  guardrailsSection.classList.remove('hidden');
  
  try {
    const res = await fetch(`/api/chatbot/sessions/${currentSessionId}/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    
    const data = await res.json();
    
    // Remove loading indicator
    loadingMsgEl.remove();
    
    if (data.error) {
      const errMsgEl = document.createElement('div');
      errMsgEl.className = 'message assistant';
      errMsgEl.innerHTML = `<div class="message-content" style="color: #f87171;">Error: ${escapeHtml(data.error)}</div>`;
      messagesDiv.appendChild(errMsgEl);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return;
    }
    
    // Update guardrails display
    const verdict = document.getElementById('guardrail-verdict');
    verdict.textContent = data.guardrail_verdict.toUpperCase();
    verdict.className = 'verdict ' + data.guardrail_verdict;
    
    const reason = document.getElementById('guardrail-reason');
    reason.textContent = data.guardrail_reason || '';
    
    // Show search results if present
    const searchSection = document.getElementById('search-section');
    if (data.search_query) {
      searchSection.classList.remove('hidden');
      document.getElementById('search-query').textContent = 'Query: ' + data.search_query;
      
      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = '';
      if (data.search_results) {
        const results = data.search_results.split('\n').filter(l => l.trim());
        results.forEach(r => {
          const resEl = document.createElement('div');
          resEl.className = 'search-result';
          resEl.textContent = r;
          resultsDiv.appendChild(resEl);
        });
      }
    } else {
      searchSection.classList.add('hidden');
    }
    
    // Add bot message to UI
    const botMsgEl = document.createElement('div');
    botMsgEl.className = 'message assistant';
    botMsgEl.innerHTML = `<div class="message-content">${escapeHtml(data.response)}</div>`;
    messagesDiv.appendChild(botMsgEl);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    
  } catch (err) {
    console.error(err);
    loadingMsgEl.innerHTML = `<div class="message-content" style="color: #f87171;">Failed to send message</div>`;
  } finally {
    messageInput.disabled = false;
    messageInput.focus();
  }
}

async function createSessionAndSend(e) {
  e.preventDefault();
  const message = document.getElementById('first-message-input').value.trim();
  if (!message) return;
  
  // Create session first
  try {
    const now = new Date();
    const title = now.toLocaleString();
    const res = await fetch('/api/chatbot/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });
    
    const data = await res.json();
    if (data.error || !data.session_id) {
      alert('Error creating chat: ' + (data.error || 'unknown'));
      return;
    }
    
    currentSessionId = data.session_id;
    
    // Reload page with new session
    window.location.href = `/chatbot?session=${currentSessionId}`;
    
    // After redirect, first message will be in input
    // Store it in localStorage to auto-send
    localStorage.setItem('chatbot_first_message', message);
  } catch (err) {
    console.error(err);
    alert('Error creating chat');
  }
}

// Check if we just created a session and need to send first message
function autoSendFirstMessage() {
  const msg = localStorage.getItem('chatbot_first_message');
  if (msg && currentSessionId) {
    localStorage.removeItem('chatbot_first_message');
    const input = document.getElementById('message-input');
    if (input) {
      input.value = msg;
      setTimeout(() => {
        document.getElementById('chat-form').dispatchEvent(new Event('submit'));
      }, 100);
    }
  }
}

async function deleteSession() {
  if (!currentSessionId) return;
  if (!confirm('Delete this chat? This cannot be undone.')) return;
  
  const res = await fetch(`/api/chatbot/sessions/${currentSessionId}`, {
    method: 'DELETE'
  });
  
  if (res.ok) {
    window.location.href = '/chatbot';
  } else {
    alert('Error deleting session');
  }
}

function escapeHtml(text) {
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, m => map[m]);
}

function toggleChatbotSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const isCollapsed = sidebar.classList.contains('collapsed');
  if (isCollapsed) {
    sidebar.classList.remove('collapsed');
  } else {
    sidebar.classList.add('collapsed');
  }
  localStorage.setItem('chatbot-sidebar-collapsed', !isCollapsed);
}

// Restore sidebar state on load
document.addEventListener('DOMContentLoaded', function() {
  if (localStorage.getItem('chatbot-sidebar-collapsed') === 'true') {
    document.querySelector('.sidebar')?.classList.add('collapsed');
  }
});

function toggleChatbotSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const isCollapsed = sidebar.classList.contains('collapsed');
  if (isCollapsed) {
    sidebar.classList.remove('collapsed');
  } else {
    sidebar.classList.add('collapsed');
  }
  localStorage.setItem('chatbot-sidebar-collapsed', !isCollapsed);
}

// Restore sidebar state
if (localStorage.getItem('chatbot-sidebar-collapsed') === 'true') {
  document.querySelector('.sidebar')?.classList.add('collapsed');
}

document.getElementById('delete-session-btn')?.addEventListener('click', deleteSession);

// Initial load
loadSessions();
if (currentSessionId) {
  loadMessages();
  autoSendFirstMessage();
}
</script>
{% endblock %}
