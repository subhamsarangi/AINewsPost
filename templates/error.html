<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ status }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 500px; text-align: center; }
        h1 { font-size: 48px; color: #e74c3c; margin-bottom: 10px; }
        .status { font-size: 18px; color: #7f8c8d; margin-bottom: 20px; }
        p { font-size: 16px; color: #555; line-height: 1.6; margin-bottom: 30px; }
        a { display: inline-block; padding: 10px 20px; background: #3498db; color: white; text-decoration: none; border-radius: 4px; transition: background 0.2s; }
        a:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ status }}</h1>
        <div class="status">
            {% if status == 404 %}
                Page Not Found
            {% elif status == 401 %}
                Unauthorized
            {% elif status >= 500 %}
                Server Error
            {% else %}
                Error
            {% endif %}
        </div>
        <p>{{ message }}</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
