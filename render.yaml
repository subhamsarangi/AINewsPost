services:
  - type: web
    name: ainewspost
    env: python
    plan: free
    buildCommand: |
      pip install uv
      uv sync
      uv run playwright install-deps chromium
      uv run playwright install chromium
    startCommand: uv run python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
