# One entry per source. The UI builds a page for each entry automatically.
# type: rss | hn | scrape
# category: research | mlops | community | funding
# default_sort: date | points
# Replace every TODO url with the real feed / listing page before running.

sources:
  - id: hn
    name: Hacker News
    type: hn
    category: community
    default_sort: points
    min_points: 100
    keywords: [ai, llm, gpt, openai, anthropic, claude, gemini, "machine learning", agent, agentic, harness, rag, transformer, "Platform engineering", "AI training"]

  - id: arize
    name: Arize Blog
    type: rss
    category: mlops
    url: https://arize.com/feed/
    default_sort: date

  - id: flexera
    name: Flexera Blog
    type: rss
    category: mlops
    url: https://www.flexera.com/blog/feed/
    default_sort: date

  - id: edith_yeung
    name: Edith Yeung Newsletter
    type: rss
    category: funding
    url: https://edithyeung.substack.com/feed
    default_sort: date

  # Frontier labs: use type rss if the lab has a feed, otherwise type scrape.
  - id: openai
    name: OpenAI Research
    type: rss
    category: research
    url: https://openai.com/news/rss.xml

  - id: deepmind
    name: Google DeepMind
    type: rss
    category: research
    url: https://deepmind.google/blog/feed/basic/

  - id: anthropic
    name: Anthropic Research
    type: scrape
    category: research
    url: https://www.anthropic.com/research
    selectors:
      item: 'a[class*="PublicationList"][class*="listItem"]'
      link: self
      title: '[class*="title"]'
      date: time

  - id: the_batch
    name: The Batch (DeepLearning.AI)
    type: scrape
    category: news
    url: https://www.deeplearning.ai/the-batch/
    default_sort: date
    selectors:
      item: "article.card"
      link: 'a[href*="/the-batch/issue"]'
      title: "h2, h3"
      date: "a.badge"

  - id: techgig_et
    name: TechGig ET Newsletter
    type: scrape
    category: news
    url: https://techgig.com/etnewsletter.php
    default_sort: date
    selectors:
      item: 'td[style*="dashed"]'
      link: a
      title: a
      link_param: url
      date_param: dt