name: Keep Render site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          code=$(curl -s -o /dev/null -m 90 --retry 3 --retry-delay 10 \
            -w "%{http_code}" https://ainewspost-9fcb.onrender.com/)
          echo "HTTP $code"
          # 2xx/3xx/4xx = app is awake. 000 or 5xx = problem.
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then exit 1; fi