name: Keep Render site awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          curl -fsS --retry 3 --retry-delay 10 -m 90 \
            -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            https://ainewspost-9fcb.onrender.com/