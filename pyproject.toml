[project]
name = "ai-digest"
version = "0.1.0"
description = "Personal AI news digest: ingest, dedup, rank, PDF, search UI"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "feedparser>=6.0",
    "httpx>=0.27",
    "selectolax>=0.3",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "playwright>=1.47",   # PDF rendering (no GTK needed on Windows)
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.6",
    "boto3>=1.28",        # Cloudflare R2 uploads
    "numpy>=2.5.4",
    "nemoguardrails>=0.24.1",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.364",
    "langchain-openai>=1.7.0",
    "en-core-web-sm",
    "tavily-python>=0.8.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
